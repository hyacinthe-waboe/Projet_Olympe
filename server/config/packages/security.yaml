security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            stateless: false # 👈 AJOUTE CETTE LIGNE

            json_login:
                check_path: /login
                success_handler: App\Security\LoginSuccessHandler

            logout:
                path: app_logout

            remember_me:
                secret: "%kernel.secret%"
                lifetime: 604800
                path: /

    # Note: Only the *first* matching rule is applied
    # server/config/packages/security.yaml
    access_control:
        # Autorise l'accès à /api/me seulement si on est connecté
        - { path: ^/api/me, roles: IS_AUTHENTICATED_FULLY }

        # ✅ AJOUT : Autorise les secrétaires sur leurs outils de travail
        - {
              path: ^/api/messages/my-clients,
              roles: [ROLE_ADMIN, ROLE_SECRETAIRE],
          }
        - { path: ^/api/appelants, roles: [ROLE_ADMIN, ROLE_SECRETAIRE] }

        # L'admin gère le reste
        - { path: ^/api/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
